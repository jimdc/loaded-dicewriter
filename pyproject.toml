[project]
name = "loaded-dicewriter"
version = "0.1.0"
description = "Local-first visual laboratory for statistical text watermarking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
loaded-dicewriter = "loaded_dicewriter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/loaded_dicewriter"]

[tool.hatch.build.targets.wheel.sources]
"server" = ""

[tool.pytest.ini_options]
testpaths = ["server/tests"]
asyncio_mode = "auto"
pythonpath = ["server"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["loaded_dicewriter"]
mypy_path = "server"
exclude = ["web/", "node_modules/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
